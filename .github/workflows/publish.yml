# Publishes io.github.corneloaie:admob:<version> to Maven Central when a GitHub release is published (its tag must be
# v<version>, see gradle.properties). Run by hand, it is a dry run by default: it builds and checks the publications
# without signing or uploading anything, and keeps them as a workflow artifact. A real publish needs the four repository
# secrets below; MAINTAINING.md has the one-time Central Portal and GPG setup.

name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and check the publications, without signing or uploading'
        type: boolean
        default: true

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPEUSERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPEPASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.PASSPHRASE }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # The Xcode the library is built and tested with locally, and macos-latest's default.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Check the release tag against the version
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME is not v$version, the version in gradle.properties"
            exit 1
          fi
      - name: Check the publishing secrets
        if: env.DRY_RUN != 'true'
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set (see MAINTAINING.md)"; exit 1; fi
          done
      # Into Maven local, so nothing is signed (see the root build) or uploaded yet.
      - name: Build the publications
        run: ./gradlew :admob:publishToMavenLocal
      - name: Check the publications
        run: python3 .github/scripts/publish/check_publications.py "$HOME/.m2/repository"
      - name: Keep the publications
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publications
          path: ~/.m2/repository/io/github/corneloaie/
          if-no-files-found: ignore
      # One Central Portal deployment, which the plugin uploads only if the whole build succeeds and then releases. What
      # the step before built is up to date; this signs and uploads.
      - name: Publish to Maven Central
        if: env.DRY_RUN != 'true'
        run: ./gradlew :admob:publishToMavenCentral
